name: Build Runtime Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.21.0"
  ESBUILD_VERSION: "0.28.2"
  POSTJECT_VERSION: "1.0.0-alpha.6"
  POSTJECT_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ------------------------------------------------------------------
          # Linux x64
          # ------------------------------------------------------------------
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            archive: tar.gz

          # ------------------------------------------------------------------
          # Linux ARM64
          # ------------------------------------------------------------------
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz

          # ------------------------------------------------------------------
          # macOS x64
          # ------------------------------------------------------------------
          - platform: darwin
            arch: x64
            runner: macos-13
            archive: tar.gz

          # ------------------------------------------------------------------
          # macOS ARM64
          # ------------------------------------------------------------------
          - platform: darwin
            arch: arm64
            runner: macos-14
            archive: tar.gz

          # ------------------------------------------------------------------
          # Windows x64
          # ------------------------------------------------------------------
          - platform: win32
            arch: x64
            runner: windows-2025
            archive: zip

          # ------------------------------------------------------------------
          # Windows ARM64
          # ------------------------------------------------------------------
          - platform: win32
            arch: arm64
            runner: windows-11-arm
            archive: zip

    runs-on: ${{ matrix.runner }}

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v5.1.0

      # ======================================================================
      # Node
      # ======================================================================

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ======================================================================
      # Dependencies
      # ======================================================================

      - name: Install dependencies
        run: npm ci

      # ======================================================================
      # Normal application build
      # ======================================================================

      - name: Build application
        run: npm run build

      # ======================================================================
      # Bundle application for SEA
      # ======================================================================

      - name: Bundle SEA application
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "BUNDLING SEA APPLICATION"
          echo "================================================"

          mkdir -p runtime

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "esbuild:"
          npx esbuild@${ESBUILD_VERSION} --version

          echo ""
          echo "Bundling..."

          npx esbuild@${ESBUILD_VERSION} \
            dist/bin/codebase-indexer.js \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --outfile=runtime/codebase-indexer.cjs

          echo ""
          echo "=== SEA bundle ==="
          ls -lh runtime/codebase-indexer.cjs

      # ======================================================================
      # Runtime assets
      # ======================================================================

      - name: Prepare runtime assets
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "PREPARING RUNTIME ASSETS"
          echo "================================================"

          mkdir -p runtime

          cp -R dist/grammars runtime/
          cp -R dist/tree-sitter-wasms runtime/
          cp -R dist/workers runtime/
          cp -R dist/dashboard runtime/

          echo ""
          echo "=== Runtime contents ==="
          find runtime -maxdepth 2 -type f | sort

      # ======================================================================
      # SEA configuration
      # ======================================================================

      - name: Create SEA config
        shell: bash
        run: |
          set -e

          cat > runtime/sea-config.json <<'EOF'
          {
            "main": "runtime/codebase-indexer.cjs",
            "output": "runtime/sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF

          echo "=== SEA config ==="
          cat runtime/sea-config.json

      # ======================================================================
      # SEA blob
      # ======================================================================

      - name: Create SEA blob
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "CREATING SEA BLOB"
          echo "================================================"

          node --experimental-sea-config runtime/sea-config.json

          echo ""
          echo "=== SEA blob ==="
          ls -lh runtime/sea-prep.blob

      # ======================================================================
      # Prepare Node executable
      # ======================================================================

      - name: Prepare Node executable
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "PREPARING NODE EXECUTABLE"
          echo "================================================"

          cp "$(command -v node)" runtime/codebase-indexer

          echo ""
          echo "=== Node executable ==="
          file runtime/codebase-indexer

          echo ""
          echo "=== Original permissions ==="
          ls -lah runtime/codebase-indexer

          echo ""
          echo "=== Setting executable permissions ==="
          chmod 755 runtime/codebase-indexer

          echo ""
          echo "=== Verifying permissions ==="
          test -r runtime/codebase-indexer
          test -w runtime/codebase-indexer
          test -x runtime/codebase-indexer

          ls -lah runtime/codebase-indexer

          # ------------------------------------------------------------------
          # macOS
          # ------------------------------------------------------------------

          if [ "${{ matrix.platform }}" = "darwin" ]; then
            echo ""
            echo "================================================"
            echo "MACOS PREPARATION"
            echo "================================================"

            echo ""
            echo "=== Architecture ==="
            lipo -info runtime/codebase-indexer || true

            echo ""
            echo "=== Removing existing Apple signature ==="

            codesign \
              --remove-signature \
              runtime/codebase-indexer || true

            echo ""
            echo "=== Restoring writable permissions ==="

            chmod 755 runtime/codebase-indexer

            echo ""
            echo "=== Final permissions ==="
            ls -lah runtime/codebase-indexer

            echo ""
            echo "=== Architecture after signature removal ==="
            lipo -info runtime/codebase-indexer || true
          fi

      # ======================================================================
      # Inject SEA blob
      # ======================================================================

      - name: Inject SEA blob
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "INJECTING SEA BLOB"
          echo "================================================"

          chmod 755 runtime/codebase-indexer

          echo ""
          echo "=== Runtime executable ==="
          file runtime/codebase-indexer

          echo ""
          echo "=== Permissions ==="
          ls -lah runtime/codebase-indexer

          echo ""
          echo "=== Checking read/write/execute permissions ==="

          test -r runtime/codebase-indexer
          test -w runtime/codebase-indexer
          test -x runtime/codebase-indexer

          echo ""
          echo "=== Installing postject ==="

          npx --yes postject@${POSTJECT_VERSION} --version || true

          echo ""
          echo "=== Injecting ==="

          if [ "${{ matrix.platform }}" = "darwin" ]; then

            echo "=== macOS SEA injection ==="

            npx --yes postject@${POSTJECT_VERSION} \
              runtime/codebase-indexer \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${POSTJECT_FUSE}" \
              --macho-segment-name NODE_SEA

          else

            echo "=== Standard SEA injection ==="

            npx --yes postject@${POSTJECT_VERSION} \
              runtime/codebase-indexer \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${POSTJECT_FUSE}"

          fi

          echo ""
          echo "=== Injection completed ==="

      # ======================================================================
      # Sign macOS SEA executable
      # ======================================================================

      - name: Sign macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "SIGNING MACOS SEA EXECUTABLE"
          echo "================================================"

          chmod 755 runtime/codebase-indexer

          echo ""
          echo "=== Signing ==="

          codesign \
            --force \
            --sign - \
            runtime/codebase-indexer

          echo ""
          echo "=== Verifying signature ==="

          codesign \
            --verify \
            --verbose=4 \
            runtime/codebase-indexer

          echo ""
          echo "=== Signature information ==="

          codesign \
            -dv \
            --verbose=4 \
            runtime/codebase-indexer || true

      # ======================================================================
      # Inspect macOS SEA executable
      # ======================================================================

      - name: Inspect macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "MACOS SEA BINARY"
          echo "================================================"

          echo ""
          echo "=== file ==="
          file runtime/codebase-indexer

          echo ""
          echo "=== architecture ==="
          lipo -info runtime/codebase-indexer || true

          echo ""
          echo "=== Mach-O header ==="
          otool -hv runtime/codebase-indexer || true

          echo ""
          echo "=== SEA segment ==="
          otool -l runtime/codebase-indexer \
            | grep -A12 -B2 NODE_SEA || true

          echo ""
          echo "=== code signature ==="
          codesign \
            -dv \
            --verbose=4 \
            runtime/codebase-indexer || true

      # ======================================================================
      # Test runtime
      # ======================================================================

      - name: Test runtime
        shell: bash
        run: |
          set -e

          chmod 755 runtime/codebase-indexer

          echo "================================================"
          echo "RUNTIME HELP"
          echo "================================================"

          ./runtime/codebase-indexer --help

          echo ""
          echo "================================================"
          echo "RUNTIME STATUS"
          echo "================================================"

          ./runtime/codebase-indexer status

      # ======================================================================
      # Package runtime
      # ======================================================================

      - name: Package runtime
        shell: bash
        run: |
          set -e

          NAME="codebase-indexer-${{ matrix.platform }}-${{ matrix.arch }}"

          echo "================================================"
          echo "PACKAGING"
          echo "================================================"

          mkdir -p release

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then

            tar -czf \
              "release/${NAME}.tar.gz" \
              -C runtime \
              codebase-indexer \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard

          else

            cd runtime

            7z a \
              "../release/${NAME}.zip" \
              codebase-indexer \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard

            cd ..

          fi

          cd release

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then

            shasum -a 256 \
              "${NAME}.tar.gz" \
              > "${NAME}.sha256"

          else

            shasum -a 256 \
              "${NAME}.zip" \
              > "${NAME}.sha256"

          fi

          echo ""
          echo "=== Release files ==="
          ls -lh

      # ======================================================================
      # Upload artifact
      # ======================================================================

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*

  # ==========================================================================
  # Publish Release
  # ==========================================================================

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:

      - name: Download runtime artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: release
          pattern: runtime-*
          merge-multiple: true

      # ======================================================================
      # Combined checksums
      # ======================================================================

      - name: Generate combined checksums
        working-directory: release
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "GENERATING SHA256SUMS"
          echo "================================================"

          cat *.sha256 | sort > SHA256SUMS

          echo ""
          cat SHA256SUMS

      # ======================================================================
      # GitHub Release
      # ======================================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/SHA256SUMS