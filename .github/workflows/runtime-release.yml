name: Build Runtime Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.21.0"
  ESBUILD_VERSION: "0.28.2"
  POSTJECT_VERSION: "1.0.0-alpha.6"
  POSTJECT_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            archive: tar.gz

          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz

          - platform: darwin
            arch: x64
            runner: macos-13
            archive: tar.gz

          - platform: darwin
            arch: arm64
            runner: macos-14
            archive: tar.gz

          - platform: win32
            arch: x64
            runner: windows-2025
            archive: zip

          - platform: win32
            arch: arm64
            runner: windows-11-arm
            archive: zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Bundle SEA application
        shell: bash
        run: |
          mkdir -p runtime

          npx esbuild@${ESBUILD_VERSION} \
            dist/bin/codebase-indexer.js \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --outfile=runtime/codebase-indexer.cjs

      - name: Prepare runtime assets
        shell: bash
        run: |
          cp -R dist/grammars runtime/
          cp -R dist/tree-sitter-wasms runtime/
          cp -R dist/workers runtime/
          cp -R dist/dashboard runtime/

      - name: Create SEA config
        shell: bash
        run: |
          cat > runtime/sea-config.json <<'EOF'
          {
            "main": "runtime/codebase-indexer.cjs",
            "output": "runtime/sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF

      - name: Create SEA blob
        shell: bash
        run: |
          node --experimental-sea-config runtime/sea-config.json

      - name: Prepare Node executable
        shell: bash
        run: |
          cp "$(command -v node)" runtime/codebase-indexer

          if [ "${{ matrix.platform }}" = "darwin" ]; then
            chmod +x runtime/codebase-indexer

            echo "Node executable:"
            file runtime/codebase-indexer

            echo "Node architecture:"
            lipo -info runtime/codebase-indexer || true
          fi

      - name: Inject SEA blob
        shell: bash
        run: |
          chmod +x runtime/codebase-indexer || true

          npx postject@${POSTJECT_VERSION} \
            runtime/codebase-indexer \
            NODE_SEA_BLOB \
            runtime/sea-prep.blob \
            --sentinel-fuse "${POSTJECT_FUSE}"

      - name: Re-sign macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          echo "Re-signing macOS SEA executable..."

          codesign \
            --force \
            --deep \
            --sign - \
            runtime/codebase-indexer

          echo "Verifying signature..."
          codesign \
            --verify \
            --verbose=4 \
            runtime/codebase-indexer

      - name: Inspect macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          echo "=== File ==="
          file runtime/codebase-indexer

          echo "=== Architecture ==="
          lipo -info runtime/codebase-indexer || true

          echo "=== Mach-O ==="
          otool -hv runtime/codebase-indexer || true

          echo "=== Code Signature ==="
          codesign -dv \
            --verbose=4 \
            runtime/codebase-indexer || true

      - name: Test runtime
        shell: bash
        run: |
          chmod +x runtime/codebase-indexer || true

          echo "=== Runtime help ==="
          ./runtime/codebase-indexer --help

          echo "=== Runtime status ==="
          ./runtime/codebase-indexer status

      - name: Package runtime
        shell: bash
        run: |
          NAME="codebase-indexer-${{ matrix.platform }}-${{ matrix.arch }}"

          mkdir -p release

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "release/${NAME}.tar.gz" \
              -C runtime \
              codebase-indexer \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard
          else
            cd runtime

            7z a \
              "../release/${NAME}.zip" \
              codebase-indexer \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard

            cd ..
          fi

          cd release

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.sha256"
          else
            shasum -a 256 "${NAME}.zip" > "${NAME}.sha256"
          fi

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download runtime artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: release
          pattern: runtime-*
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: release
        shell: bash
        run: |
          cat *.sha256 | sort > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/SHA256SUMS