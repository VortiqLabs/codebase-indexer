name: Build Runtime Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.21.0"
  ESBUILD_VERSION: "0.28.2"
  POSTJECT_VERSION: "1.0.0-alpha.6"
  POSTJECT_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Linux x64
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            archive: tar.gz

          # Linux ARM64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz

          # macOS Intel x64
          - platform: darwin
            arch: x64
            runner: macos-15-intel
            archive: tar.gz

          # macOS Apple Silicon ARM64
          - platform: darwin
            arch: arm64
            runner: macos-14
            archive: tar.gz

          # Windows x64
          - platform: win32
            arch: x64
            runner: windows-2025
            archive: zip

          # Windows ARM64
          - platform: win32
            arch: arm64
            runner: windows-11-arm
            archive: zip

    runs-on: ${{ matrix.runner }}

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v5.1.0

      # ======================================================================
      # NODE
      # ======================================================================

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ======================================================================
      # DEPENDENCIES
      # ======================================================================

      - name: Install dependencies
        run: npm ci

      # ======================================================================
      # NORMAL APPLICATION BUILD
      # ======================================================================

      - name: Build application
        run: npm run build

      # ======================================================================
      # BUNDLE SEA APPLICATION
      # ======================================================================

      - name: Bundle SEA application
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "BUNDLING SEA APPLICATION"
          echo "================================================"

          mkdir -p runtime

          echo ""
          echo "=== Node ==="
          node --version

          echo ""
          echo "=== Platform ==="
          node -p "process.platform"

          echo ""
          echo "=== Architecture ==="
          node -p "process.arch"

          echo ""
          echo "=== Bundling ==="

          npx --yes esbuild@${ESBUILD_VERSION} \
            dist/bin/codebase-indexer.js \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --outfile=runtime/codebase-indexer.cjs

          echo ""
          echo "=== SEA bundle ==="
          ls -lh runtime/codebase-indexer.cjs

      # ======================================================================
      # RUNTIME ASSETS
      # ======================================================================

      - name: Prepare runtime assets
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "PREPARING RUNTIME ASSETS"
          echo "================================================"

          mkdir -p runtime

          cp -R dist/grammars runtime/
          cp -R dist/tree-sitter-wasms runtime/
          cp -R dist/workers runtime/
          cp -R dist/dashboard runtime/

          echo ""
          echo "=== Runtime files ==="
          find runtime -maxdepth 2 -type f | sort

      # ======================================================================
      # SEA CONFIG
      # ======================================================================

      - name: Create SEA config
        shell: bash
        run: |
          set -euo pipefail

          cat > runtime/sea-config.json <<'EOF'
          {
            "main": "runtime/codebase-indexer.cjs",
            "output": "runtime/sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF

          echo "=== SEA config ==="
          cat runtime/sea-config.json

      # ======================================================================
      # SEA BLOB
      # ======================================================================

      - name: Create SEA blob
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CREATING SEA BLOB"
          echo "================================================"

          node --experimental-sea-config runtime/sea-config.json

          echo ""
          echo "=== SEA blob ==="
          ls -lh runtime/sea-prep.blob

      # ======================================================================
      # PREPARE NODE EXECUTABLE
      # ======================================================================

      - name: Prepare Node executable
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "PREPARING NODE EXECUTABLE"
          echo "================================================"

          if [ "${{ matrix.platform }}" = "win32" ]; then

            echo "=== Windows executable ==="

            cp "$(command -v node)" \
              runtime/codebase-indexer.exe

            echo ""
            echo "=== File information ==="
            file runtime/codebase-indexer.exe

            echo ""
            echo "=== Permissions ==="
            ls -lah runtime/codebase-indexer.exe

          else

            echo "=== Unix executable ==="

            cp "$(command -v node)" \
              runtime/codebase-indexer

            chmod 755 runtime/codebase-indexer

            echo ""
            echo "=== File information ==="
            file runtime/codebase-indexer

            echo ""
            echo "=== Permissions ==="
            ls -lah runtime/codebase-indexer

            test -r runtime/codebase-indexer
            test -w runtime/codebase-indexer
            test -x runtime/codebase-indexer

            if [ "${{ matrix.platform }}" = "darwin" ]; then

              echo ""
              echo "================================================"
              echo "MACOS PREPARATION"
              echo "================================================"

              echo ""
              echo "=== Architecture ==="
              lipo -info runtime/codebase-indexer || true

              echo ""
              echo "=== Removing existing macOS signature ==="

              codesign \
                --remove-signature \
                runtime/codebase-indexer || true

              chmod 755 runtime/codebase-indexer

              echo ""
              echo "=== Final permissions ==="
              ls -lah runtime/codebase-indexer

            fi

          fi

      # ======================================================================
      # INJECT SEA BLOB
      # ======================================================================

      - name: Inject SEA blob
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INJECTING SEA BLOB"
          echo "================================================"

          if [ "${{ matrix.platform }}" = "win32" ]; then

            TARGET="runtime/codebase-indexer.exe"

            echo "=== Windows target ==="
            file "$TARGET"
            ls -lah "$TARGET"

            echo ""
            echo "=== Injecting Windows SEA blob ==="

            npx --yes postject@${POSTJECT_VERSION} \
              "$TARGET" \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${POSTJECT_FUSE}"

          elif [ "${{ matrix.platform }}" = "darwin" ]; then

            TARGET="runtime/codebase-indexer"

            chmod 755 "$TARGET"

            echo "=== macOS target ==="
            file "$TARGET"

            echo ""
            echo "=== Architecture ==="
            lipo -info "$TARGET" || true

            echo ""
            echo "=== Injecting macOS SEA blob ==="

            npx --yes postject@${POSTJECT_VERSION} \
              "$TARGET" \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${POSTJECT_FUSE}" \
              --macho-segment-name NODE_SEA

          else

            TARGET="runtime/codebase-indexer"

            chmod 755 "$TARGET"

            echo "=== Linux target ==="
            file "$TARGET"

            echo ""
            echo "=== Injecting Linux SEA blob ==="

            npx --yes postject@${POSTJECT_VERSION} \
              "$TARGET" \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${POSTJECT_FUSE}"

          fi

          echo ""
          echo "=== SEA injection completed ==="

      # ======================================================================
      # SIGN MACOS
      # ======================================================================

      - name: Sign macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "SIGNING MACOS SEA EXECUTABLE"
          echo "================================================"

          chmod 755 runtime/codebase-indexer

          echo ""
          echo "=== Signing ==="

          codesign \
            --force \
            --sign - \
            runtime/codebase-indexer

          echo ""
          echo "=== Verifying signature ==="

          codesign \
            --verify \
            --verbose=4 \
            runtime/codebase-indexer

          echo ""
          echo "=== Signature information ==="

          codesign \
            -dv \
            --verbose=4 \
            runtime/codebase-indexer || true

      # ======================================================================
      # INSPECT MACOS SEA
      # ======================================================================

      - name: Inspect macOS SEA executable
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "MACOS SEA BINARY"
          echo "================================================"

          echo ""
          echo "=== file ==="
          file runtime/codebase-indexer

          echo ""
          echo "=== architecture ==="
          lipo -info runtime/codebase-indexer || true

          echo ""
          echo "=== Mach-O header ==="
          otool \
            -hv \
            runtime/codebase-indexer || true

          echo ""
          echo "=== SEA segment ==="

          otool \
            -l \
            runtime/codebase-indexer \
            | grep -A12 -B2 NODE_SEA || true

          echo ""
          echo "=== code signature ==="

          codesign \
            -dv \
            --verbose=4 \
            runtime/codebase-indexer || true

      # ======================================================================
      # TEST RUNTIME
      # ======================================================================

      - name: Test runtime
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "TESTING SEA RUNTIME"
          echo "================================================"

          if [ "${{ matrix.platform }}" = "win32" ]; then

            TARGET="runtime/codebase-indexer.exe"

            echo ""
            echo "=== Runtime file ==="
            file "$TARGET"

            echo ""
            echo "=== Runtime help ==="
            "$TARGET" --help

            echo ""
            echo "=== Runtime status ==="
            "$TARGET" status

          else

            TARGET="runtime/codebase-indexer"

            chmod 755 "$TARGET"

            echo ""
            echo "=== Runtime file ==="
            file "$TARGET"

            echo ""
            echo "=== Runtime help ==="
            "$TARGET" --help

            echo ""
            echo "=== Runtime status ==="
            "$TARGET" status

          fi

          echo ""
          echo "================================================"
          echo "RUNTIME TESTS PASSED"
          echo "================================================"

      # ======================================================================
      # PACKAGE RUNTIME
      # ======================================================================

      - name: Package runtime
        shell: bash
        run: |
          set -euxo pipefail

          NAME="codebase-indexer-${{ matrix.platform }}-${{ matrix.arch }}"

          echo "================================================"
          echo "PACKAGING"
          echo "================================================"

          mkdir -p release

          echo ""
          echo "=== Platform ==="
          echo "${{ matrix.platform }}"

          echo ""
          echo "=== Architecture ==="
          echo "${{ matrix.arch }}"

          echo ""
          echo "=== Archive ==="
          echo "${{ matrix.archive }}"

          echo ""
          echo "=== Runtime directory ==="
          ls -lah runtime

          echo ""
          echo "=== Checking required runtime files ==="

          if [ "${{ matrix.platform }}" = "win32" ]; then
            test -f runtime/codebase-indexer.exe
          else
            test -f runtime/codebase-indexer
          fi

          test -d runtime/grammars
          test -d runtime/tree-sitter-wasms
          test -d runtime/workers
          test -d runtime/dashboard

          echo ""
          echo "=== Packaging ==="

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then

            echo "Creating ${NAME}.tar.gz"

            tar -czf \
              "release/${NAME}.tar.gz" \
              -C runtime \
              codebase-indexer \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard

          elif [ "${{ matrix.archive }}" = "zip" ]; then

            echo "Creating ${NAME}.zip"

            cd runtime

            7z a \
              "../release/${NAME}.zip" \
              codebase-indexer.exe \
              grammars \
              tree-sitter-wasms \
              workers \
              dashboard

            cd ..

          else

            echo "ERROR: Unknown archive format: ${{ matrix.archive }}"
            exit 1

          fi

          echo ""
          echo "=== Release directory ==="
          ls -lah release

          echo ""
          echo "=== Generating checksum ==="

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            FILE="release/${NAME}.tar.gz"
            CHECKSUM="release/${NAME}.sha256"
            FILENAME="${NAME}.tar.gz"
          else
            FILE="release/${NAME}.zip"
            CHECKSUM="release/${NAME}.sha256"
            FILENAME="${NAME}.zip"
          fi

          node -e "
            const fs = require('fs');
            const crypto = require('crypto');

            const file = process.argv[1];
            const output = process.argv[2];
            const filename = process.argv[3];

            const hash = crypto
              .createHash('sha256')
              .update(fs.readFileSync(file))
              .digest('hex');

            fs.writeFileSync(
              output,
              hash + '  ' + filename + '\\n'
            );

            console.log(hash + '  ' + filename);
          " "$FILE" "$CHECKSUM" "$FILENAME"

          echo ""
          echo "=== Final release files ==="
          ls -lah release

          echo ""
          echo "=== Checksum ==="
          cat "$CHECKSUM"

      # ======================================================================
      # UPLOAD ARTIFACT
      # ======================================================================

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*

  # ==========================================================================
  # PUBLISH GITHUB RELEASE
  # ==========================================================================

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:

      # ======================================================================
      # DOWNLOAD ARTIFACTS
      # ======================================================================

      - name: Download runtime artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: release
          pattern: runtime-*
          merge-multiple: true

      # ======================================================================
      # COMBINED CHECKSUMS
      # ======================================================================

      - name: Generate combined checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "GENERATING SHA256SUMS"
          echo "================================================"

          cat *.sha256 | sort > SHA256SUMS

          echo ""
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # ======================================================================
      # PUBLISH RELEASE
      # ======================================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/SHA256SUMS