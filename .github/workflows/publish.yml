name: Publish GitHub Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@vortiqlabs'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Make CLI executables executable
        run: |
          chmod +x dist/bin/codebase-indexer.js
          chmod +x dist/bin/codebase-indexer-mcp.js

      - name: Verify CLI executables
        run: |
          ls -l dist/bin/
          test -x dist/bin/codebase-indexer.js
          test -x dist/bin/codebase-indexer-mcp.js

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
