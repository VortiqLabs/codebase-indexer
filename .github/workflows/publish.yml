name: Build Standalone Runtime

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.21.0"
  ESBUILD_VERSION: "0.28.2"
  POSTJECT_VERSION: "1.0.0-alpha.6"
  SEA_FUSE: "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # Linux x64
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            binary: codebase-indexer
            archive: codebase-indexer-linux-x64.tar.gz
            checksum: codebase-indexer-linux-x64.sha256

          # Linux ARM64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            binary: codebase-indexer
            archive: codebase-indexer-linux-arm64.tar.gz
            checksum: codebase-indexer-linux-arm64.sha256

          # Windows x64
          - target: win32-x64
            runner: windows-2025
            architecture: x64
            binary: codebase-indexer.exe
            archive: codebase-indexer-win32-x64.zip
            checksum: codebase-indexer-win32-x64.sha256

          # Windows ARM64
          - target: win32-arm64
            runner: windows-11-arm
            architecture: arm64
            binary: codebase-indexer.exe
            archive: codebase-indexer-win32-arm64.zip
            checksum: codebase-indexer-win32-arm64.sha256

          # macOS Intel
          - target: darwin-x64
            runner: macos-15-intel
            architecture: x64
            binary: codebase-indexer
            archive: codebase-indexer-darwin-x64.tar.gz
            checksum: codebase-indexer-darwin-x64.sha256

          # macOS Apple Silicon
          - target: darwin-arm64
            runner: macos-15
            architecture: arm64
            binary: codebase-indexer
            archive: codebase-indexer-darwin-arm64.tar.gz
            checksum: codebase-indexer-darwin-arm64.sha256

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5.1.0

      # ------------------------------------------------------------
      # Node
      # ------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.architecture }}
          cache: npm

      - name: Show versions
        shell: bash
        run: |
          node --version
          npm --version

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      - name: Install pinned SEA tool
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            postject@${{ env.POSTJECT_VERSION }}

      - name: Verify esbuild
        shell: bash
        run: |
          npx esbuild --version

      # ------------------------------------------------------------
      # Existing project build
      # ------------------------------------------------------------

      - name: Build project
        run: npm run build

      # ------------------------------------------------------------
      # Bundle CLI
      # ------------------------------------------------------------

      - name: Bundle CLI runtime
        shell: bash
        run: |
          rm -rf runtime package

          mkdir -p runtime
          mkdir -p package

          npx esbuild@${ESBUILD_VERSION} \
            dist/bin/codebase-indexer.js \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --outfile=runtime/codebase-indexer.cjs \
            --minify

      # ------------------------------------------------------------
      # SEA preparation blob
      # ------------------------------------------------------------

      - name: Create SEA preparation blob
        shell: bash
        run: |
          cat > runtime/sea-config.json <<EOF
          {
            "main": "${GITHUB_WORKSPACE}/runtime/codebase-indexer.cjs",
            "output": "${GITHUB_WORKSPACE}/runtime/sea-prep.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": false
          }
          EOF

          node --experimental-sea-config \
            runtime/sea-config.json

      # ------------------------------------------------------------
      # Linux + macOS
      # ------------------------------------------------------------

      - name: Create Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v node)" \
            "runtime/${{ matrix.binary }}"

          # macOS Node binaries are signed.
          # Remove signature before modifying the binary.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign \
              --remove-signature \
              "runtime/${{ matrix.binary }}" || true
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then

            npx postject@${POSTJECT_VERSION} \
              "runtime/${{ matrix.binary }}" \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${SEA_FUSE}" \
              --macho-segment-name NODE_SEA

          else

            npx postject@${POSTJECT_VERSION} \
              "runtime/${{ matrix.binary }}" \
              NODE_SEA_BLOB \
              runtime/sea-prep.blob \
              --sentinel-fuse "${SEA_FUSE}"

          fi

          chmod +x \
            "runtime/${{ matrix.binary }}"

          # Ad-hoc sign macOS binary after modification.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign \
              --sign - \
              "runtime/${{ matrix.binary }}"
          fi

      # ------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------

      - name: Create Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item `
            (Get-Command node).Source `
            "runtime\codebase-indexer.exe"

          npx postject@${env:POSTJECT_VERSION} `
            "runtime\codebase-indexer.exe" `
            NODE_SEA_BLOB `
            "runtime\sea-prep.blob" `
            --sentinel-fuse "${env:SEA_FUSE}"

      # ------------------------------------------------------------
      # Runtime assets
      # ------------------------------------------------------------

      - name: Prepare runtime package
        shell: bash
        run: |
          mkdir -p package/grammars

          mkdir -p \
            package/node_modules/tree-sitter-wasms/out

          mkdir -p \
            package/node_modules/web-tree-sitter

          cp \
            "runtime/${{ matrix.binary }}" \
            "package/${{ matrix.binary }}"

          # Your locally maintained grammars
          if [ -d "dist/src/parser/grammars" ]; then
            cp -R \
              dist/src/parser/grammars/. \
              package/grammars/
          fi

          # tree-sitter-wasms language files
          cp -R \
            node_modules/tree-sitter-wasms/out/. \
            package/node_modules/tree-sitter-wasms/out/

          # web-tree-sitter runtime WASM
          if [ -f "node_modules/web-tree-sitter/tree-sitter.wasm" ]; then
            cp \
              node_modules/web-tree-sitter/tree-sitter.wasm \
              package/node_modules/web-tree-sitter/
          fi

          # Keep the runtime metadata
          echo "${{ matrix.target }}" \
            > package/runtime-target.txt

          echo "${GITHUB_REF_NAME}" \
            > package/runtime-version.txt

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------

      - name: Verify Linux/macOS runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x \
            "package/${{ matrix.binary }}"

          "./package/${{ matrix.binary }}" \
            --help

      - name: Verify Windows runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "package\${{ matrix.binary }}" --help

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package Unix runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar \
            -czf "${{ matrix.archive }}" \
            -C package .

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "${{ matrix.archive }}" `
            -Force

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------

      - name: Generate SHA-256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then

            sha256sum \
              "${{ matrix.archive }}" \
              > "${{ matrix.checksum }}"

          else

            shasum -a 256 \
              "${{ matrix.archive }}" \
              > "${{ matrix.checksum }}"

          fi

      # ------------------------------------------------------------
      # Actions artifact
      # ------------------------------------------------------------

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.target }}

          path: |
            ${{ matrix.archive }}
            ${{ matrix.checksum }}

          if-no-files-found: error

  # ================================================================
  # RELEASE
  # ================================================================

  release:
    name: Publish GitHub Release

    needs:
      - build

    runs-on: ubuntu-24.04

    steps:

      - name: Download runtime artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: release-assets
          pattern: runtime-*
          merge-multiple: true

      - name: Create combined SHA256 file
        shell: bash
        run: |
          cd release-assets

          cat \
            *.sha256 \
            > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}

          name: Codebase Indexer ${{ github.ref_name }}

          generate_release_notes: true

          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/SHA256SUMS
